name: Offline tests
on: [push, pull_request]
jobs:
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m flipper2jb --help
      - run: python -m flipper2jb.targets.ns2jb --help
      - run: python -m pip install -r requirements-bluetooth.txt
      - run: python -c "from flipper2jb.ble import bleak_api; bleak_api()"
